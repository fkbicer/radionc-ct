[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radionc-ct"
version = "0.1.0"
description = "Radiomics extraction for pretreatment planning CT (CMPE 491)"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<2",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "xgboost>=1.7",
  "joblib>=1.2",
  "pydicom>=2.4",
  "pyradiomics==3.0.1",
  "SimpleITK>=2.2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rad = "rad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
