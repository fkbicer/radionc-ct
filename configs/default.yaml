seed: 42

# Paths are relative to the project root.
# Report references: 4.2 DICOM, 4.3 preprocessing, 4.4 radiomic extraction, 4.5 clinical, Appendix B.

paths:
  raw_root: data/raw                      # data/raw/<patient_id>/inbox/*.dcm
  features_dir: data/features             # pseudonymized extraction output (may be versioned)
  clinical_csv: lung1_stage3_cohort.csv
  outputs_dir: outputs                    # one sub-folder per run (git-ignored)

dicom:
  inbox_subdir: inbox
  # Header audit (report FR3): processing stops if a patient does not match.
  patient_id_pattern: '^(P\d{3}|LUNG1-\d{3})$'
  must_be_empty_tags:
    - PatientBirthDate
    - PatientAddress
    - PatientTelephoneNumbers
    - OtherPatientIDs
  missing_slice: interpolate              # interpolate | air

# ROI names are matched exactly after lower-casing and dropping punctuation.
rois:
  gtv:
    aliases: [gtv, gtv1]
  periphery:
    aliases: [peritumoralspace, periphery]
    derive_from: gtv                      # used when no contour is found
    margin_mm: 5
    exclude: gtv                          # ring only: GTV and periphery never overlap

audit:
  min_volume_cm3: 0.5
  max_volume_cm3: 800
  max_off_plane_fraction: 0.05

radiomics:
  # Passed to PyRadiomics as-is (report Appendix B). binWidth is in HU for CT.
  params:
    setting:
      binWidth: 25
      resampledPixelSpacing: [2, 2, 2]
      interpolator: sitkBSpline
      label: 1
      correctMask: true
      preCrop: true
    imageType:
      Original: {}
      # ablation (report 4.4): enable the next two lines
      # Wavelet: {}
      # LoG: {sigma: [1.0, 2.0, 3.0]}
    featureClass:
      shape:
      firstorder:
      glcm:
      glrlm:
      glszm:
      ngtdm:
      gldm:

clinical:
  id_column: PatientID
  label_column: label_2yr
  time_column: Survival.time              # label generation only, never a feature
  event_column: deadstatus.event          # label generation only, never a feature
  horizon_days: 730
  numeric: [age, clinical.T.Stage, Clinical.N.Stage]
  categorical: [gender, Histology]
  # Clinical.M.Stage (282/287 zero) and Overall.Stage (derived from T and N)
  # are intentionally not used.

selection:                                # re-learned inside every training fold (report 4.6)
  max_missing: 0.20
  near_constant_variance: 1.0e-8
  min_icc: 0.75                           # used only when an ICC table is supplied
  corr_threshold: 0.90
  k_max: 15
  fallback_k: 5
  seed: 42
  enet:
    C: 0.1
    l1_ratio: 0.5

models: [logreg, svm, rf, xgboost]

# Model ladder (report Table 8). Lung1 has no PET, so M3/M4 do not exist here.
# groups: "clin" or an ROI name from `rois`. A set whose group is missing is skipped.
ladder:
  M0: {prior: true}
  M1: {groups: [clin]}
  M2: {groups: [gtv]}
  M5: {groups: [gtv, periphery]}
  M6: {groups: [gtv, periphery, clin]}

validation:
  outer_folds: 5
  repeats: 10                             # report suggests 20 for the final run
  inner_folds: 3
  bootstrap: 1000                         # resamples for confidence intervals and paired differences
  permutation_repeats: 1                  # CV repeats per shuffled-label run
  n_jobs: -1
